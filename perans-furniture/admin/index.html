<!-- ============================ LOGIN ============================ -->
<div class="login" id="login">
  <span class="login__orb o1"></span>
  <span class="login__orb o2"></span>
  <span class="login__grain"></span>
  <form class="login__card" id="loginForm" autocomplete="off">
    <div class="login__seal"><svg><use href="#a-logo"/></svg></div>
    <h1>پنل مدیریت پرنس</h1>
    <p class="login__sub">برای ویرایش سایت، وارد شوید — <b>PERANS · BIRJAND</b></p>
    <div class="fieldset">
      <div class="lf">
        <label for="pw">رمز عبور</label>
        <div class="wrap">
          <span class="ico"><svg><use href="#a-lock"/></svg></span>
          <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button class="eye" type="button" id="eye" aria-label="نمایش رمز"><svg><use href="#a-eye"/></svg></button>
        </div>
      </div>
      <div class="row-between">
        <label class="chk"><input type="checkbox" id="remember" checked><i><svg><use href="#a-check"/></svg></i> مرا به خاطر بسپار</label>
        <a class="hint" href="#" onclick="return false">رمز پیش‌فرض: perans1404</a>
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn--gold btn--block" type="submit" id="loginBtn">
        ورود به پنل <svg><use href="#a-out"/></svg>
      </button>
    </div>
    <div class="login__foot">دسترسی محدود · تمام تغییرات فقط روی همین مرورگر و فایل داده‌ی سایت ذخیره می‌شود</div>
  </form>
</div>

<!-- ============================ APP ============================ -->
<div class="app" id="app">
  <aside class="side" id="side">
    <button class="side__close" id="sideClose"><svg width="16" height="16"><use href="#a-x"/></svg></button>
    <div class="side__brand">
      <span class="side__mark"><svg><use href="#a-logo"/></svg></span>
      <div><b>مبل پرنس</b><small>PERANS ADMIN</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav__item on" data-view="dash" style="--i:0"><svg><use href="#a-grid"/></svg> داشبورد</button>
      <button class="nav__item" data-view="products" style="--i:1"><svg><use href="#a-box"/></svg> محصولات <span class="nav__badge" id="navProducts">—</span></button>
      <button class="nav__item" data-view="orders" style="--i:2"><svg><use href="#a-cart"/></svg> سفارش‌ها <span class="nav__badge" id="navOrders">۰</span></button>
      <button class="nav__item" data-view="cats" style="--i:3"><svg><use href="#a-layers"/></svg> دسته‌بندی‌ها</button>
      <button class="nav__item" data-view="content" style="--i:4"><svg><use href="#a-edit"/></svg> محتوای صفحه</button>
      <button class="nav__item" data-view="commerce" style="--i:5"><svg><use href="#a-tag"/></svg> فروش و تخفیف</button>
      <button class="nav__item" data-view="settings" style="--i:6"><svg><use href="#a-cog"/></svg> تنظیمات و تماس</button>
      <button class="nav__item" data-view="backup" style="--i:7"><svg><use href="#a-save"/></svg> پشتیبان‌گیری</button>
    </nav>
    <div class="side__foot">
      <div class="side__user">
        <span class="side__avatar">پ</span>
        <div><b>مدیر فروشگاه</b><small id="lastSaved">—</small></div>
      </div>
      <button class="side__out" id="logout"><svg width="15" height="15"><use href="#a-out"/></svg> خروج از حساب</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="iconbtn" id="sideOpen" style="display:none"><svg><use href="#a-menu"/></svg></button>
      <div class="top__title"><h2 id="pageTitle">داشبورد</h2><p id="pageSub">نمای کلی فروشگاه</p></div>
      <div class="top__search"><input id="globalSearch" placeholder="جستجوی محصول…"><svg><use href="#a-search"/></svg></div>
      <div class="top__act">
        <a class="iconbtn" href="../index.html" target="_blank" title="مشاهده سایت"><svg><use href="#a-eye"/></svg></a>
        <button class="iconbtn" id="saveAll" title="ذخیره و انتشار در سایت"><svg><use href="#a-save"/></svg><span class="dot-live"></span></button>
      </div>
    </header>

    <section class="view on" id="view-dash"></section>
    <section class="view" id="view-products"></section>
    <section class="view" id="view-orders"></section>
    <section class="view" id="view-cats"></section>
    <section class="view" id="view-content"></section>
    <section class="view" id="view-commerce"></section>
    <section class="view" id="view-settings"></section>
    <section class="view" id="view-backup"></section>
  </div>
</div>

<div class="modal" id="modal"><div class="modal__box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="filePick" accept="application/json,.json" style="display:none">

<script src="admin.js?v=5"></script>
</body>
</html>
