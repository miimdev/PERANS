name: Deploy PERANS Website to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Prepare & Validate Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare static site bundle
        run: |
          set -euo pipefail
          test -f perans-furniture/index.html
          test -f perans-furniture/admin/index.html
          test -f perans-furniture/admin/admin.css
          test -f perans-furniture/admin/admin.js
          test -f perans-furniture/js/supabase-client.js
          test -f perans-furniture/js/app.js
          test -f perans-furniture/js/data.js
          rm -rf _site
          mkdir -p _site
          cp -R perans-furniture/. _site/
          rm -f _site/README.md _site/fonts/_README.txt
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Guide if GitHub Pages is not enabled yet
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ نیاز به فعال‌سازی اولیه GitHub Pages
          برای آنلاین شدن سایت از طریق GitHub Actions، یک بار این تنظیم را انجام دهید:
          1. وارد بخش تنظیمات Pages مخزن شوید: `https://github.com/${{ github.repository }}/settings/pages`
          2. در قسمت **Build and deployment**، مقدار **Source** را روی **GitHub Actions** بگذارید.
          3. در تب **Actions** روی **Re-run all jobs** یا **Run workflow** کلیک کنید.
          EOF

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write deployment summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ✅ سایت مبل پرنس آنلاین شد!
          - 🌐 **آدرس اصلی سایت:** ${{ steps.deployment.outputs.page_url }}
          - 🔐 **پنل مدیریت:** ${{ steps.deployment.outputs.page_url }}admin/
          EOF
